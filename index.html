<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Toolbox — Legal & Policies</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid #2a2a2a;
        }
        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn {
            display: block;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #bb86fc;
            color: #121212;
        }
        .btn-primary:hover {
            background-color: #d7b7fd;
        }
        .btn-secondary {
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #3c3c3c;
        }
        .btn-secondary:hover {
            background-color: #383838;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #71717a;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>NFC Toolbox</h1>
        <p>Official legal documentation and policies.</p>
        <div class="btn-group">
            <a href="privacy-policy.html" class="btn btn-primary">Privacy Policy</a>
            <a href="terms-of-use.html" class="btn btn-secondary">Terms of Use</a>
        </div>
        <div class="footer">
            &copy; 2026 NFC Toolbox. All rights reserved.
        </div>
    </div>
</body>
</html>
